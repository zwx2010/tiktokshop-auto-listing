<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书机器人跨境铺货工作流｜公开演示</title>
  <style>
    :root{--panel:#fff;--line:#e5e8ef;--text:#1f2329;--muted:#8f959e;--blue:#3370ff;--cyan:#14c7c7;--green:#34c724;--nav:#f7f8fa}
    *{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;background:#e9edf4;color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}.app{width:1280px;height:720px;background:var(--panel);display:grid;grid-template-columns:220px 1fr;position:relative}.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:18px 14px}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:4px 8px 20px}.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#35d4d4,#3370ff);color:#fff;display:grid;place-items:center}.search{height:34px;border-radius:8px;background:#eaedf2;color:#a2a8b0;padding:8px 12px;font-size:12px;margin-bottom:14px}.nav{padding:10px 12px;border-radius:8px;font-size:13px;margin:4px 0}.nav.active{background:#e8efff;color:var(--blue);font-weight:700}.group-title{color:#a2a8b0;font-size:11px;padding:18px 12px 8px}.chat-item{display:flex;gap:9px;align-items:center;padding:9px;border-radius:8px;background:#eaf0ff;font-size:12px;font-weight:650}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#d9e5ff;color:var(--blue);font-weight:800}.main{display:grid;grid-template-rows:62px 1fr}.topbar{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.title{font-size:16px;font-weight:700}.members{font-size:12px;color:var(--muted)}.demo{padding:7px 12px;border-radius:999px;background:#fff5e6;color:#d96b00;border:1px solid #ffd79a;font-size:11px}.content{background:#f5f6f8;position:relative;overflow:hidden}.chat{width:820px;height:100%;margin:0 auto;padding:18px 0 54px}.date{text-align:center;color:#a2a8b0;font-size:11px;margin-bottom:13px}.msg{display:flex;gap:10px;margin:12px 0;align-items:flex-start}.msg.user{flex-direction:row-reverse}.msg .avatar{flex:0 0 auto}.bubble{max-width:690px;background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 14px;box-shadow:0 1px 2px rgba(31,35,41,.04);font-size:13px;line-height:1.6}.user .bubble{background:#e8f0ff;border-color:#d5e2ff;border-radius:14px 4px 14px 14px}.name{font-size:11px;color:var(--muted);margin-bottom:4px}.user .name{text-align:right}.card{width:650px;background:#fff;border:1px solid #dfe3eb;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(31,35,41,.07)}.card-head{background:linear-gradient(115deg,#eff4ff,#eefbfb);padding:14px 17px;border-bottom:1px solid var(--line)}.card-head strong{font-size:15px}.card-head p{margin:4px 0 0;font-size:11px;color:#69707a}.card-body{padding:13px 17px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.step{background:#f6f7f9;border-radius:8px;padding:9px 8px;font-size:11px;text-align:center;color:#69707a}.step b{display:block;color:#1f2329;font-size:12px;margin-bottom:3px}.step.done{background:#edf9ee;color:#359b2c}.step.running{background:#edf3ff;color:var(--blue)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px}.metric{background:#f6f7f9;border-radius:8px;padding:10px}.metric b{font-size:20px;color:var(--blue);display:block}.metric span{font-size:10px;color:#8f959e}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eff1f5;padding:7px 1px;font-size:11px}.row:last-child{border:0}.pill{padding:3px 7px;border-radius:999px;font-size:9px;font-weight:700}.ok{background:#e8f8e6;color:#2c9b27}.wait{background:#fff2dc;color:#d46b08}.bad{background:#ffeded;color:#d83b3b}.info{background:#e8f0ff;color:#2e64db}.buttons{display:flex;gap:8px;padding:11px 17px;border-top:1px solid var(--line)}.button{border:1px solid #cfd5df;border-radius:7px;padding:7px 12px;font-size:11px;background:#fff}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.safe{color:#247b21;border-color:#8bd184}.progress{height:6px;background:#e8ebf0;border-radius:10px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.callback{display:flex;gap:12px;align-items:center}.check{width:40px;height:40px;border-radius:50%;background:#e8f8e6;color:var(--green);display:grid;place-items:center;font-size:23px}.small{font-size:10px;color:var(--muted)}.sheet{height:100%;background:#fff}.sheetbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.sheetname{font-weight:700}.toolbar{height:42px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:0 18px;font-size:11px;color:#59616d}.tablewrap{padding:12px 18px}.table-note{padding:10px 13px;background:#fff7e8;border:1px solid #ffe0a6;border-radius:8px;color:#b46600;font-size:11px;margin-bottom:10px}.sheet table{width:100%;border-collapse:collapse;font-size:10px}.sheet th{background:#f2f4f7;color:#646b75;text-align:left;padding:8px;border:1px solid #e2e5eb}.sheet td{padding:8px;border:1px solid #e7e9ee}.market{color:#635bdb;font-weight:700}.status{color:#249c32;font-weight:700}.mask{color:#a1a7b0}.cursor{position:absolute;width:20px;height:26px;right:285px;bottom:85px;transform:rotate(-18deg);filter:drop-shadow(0 1px 1px #fff)}.cursor:before{content:"";display:block;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:24px solid #202124}.footer{position:absolute;bottom:10px;left:235px;right:14px;display:flex;justify-content:space-between;color:#a1a7b0;font-size:9px}.counter{display:flex;gap:4px}.counter i{width:18px;height:3px;background:#d8dce3;border-radius:5px}.counter i.on{background:var(--blue)}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="logo">飞</div><span>飞书</span></div><div class="search">🔍 搜索</div><div class="nav">💬 消息</div><div class="nav active">🤖 机器人工作台</div><div class="nav">📊 多维表格</div><div class="group-title">置顶群组</div><div class="chat-item"><div class="avatar">AI</div><span>跨境铺货自动化</span></div><div class="group-title">应用</div><div class="nav">📦 选品与上架</div><div class="nav">🛡️ 审批记录</div></aside>
  <main class="main"><header class="topbar"><div><div class="title" id="page-title">跨境铺货自动化</div><div class="members">运营团队 · AI 上架机器人</div></div><div class="demo">公开演示 · 脱敏样例数据</div></header><div class="content" id="content"></div></main>
  <div class="footer"><span>按项目真实工作流结构制作；不包含商家账号、密钥或真实商品数据</span><span class="counter" id="counter"></span></div>
</div>
<script>
const n=Math.max(1,Math.min(6,Number(new URLSearchParams(location.search).get('step')||1)));
const user=(text)=>`<div class="msg user"><div class="avatar">我</div><div><div class="name">运营</div><div class="bubble">${text}</div></div></div>`;
const bot=(text)=>`<div class="msg"><div class="avatar">AI</div><div><div class="name">AI 上架机器人</div><div class="bubble">${text}</div></div></div>`;
const wrap=(html)=>`<div class="chat"><div class="date">今天 10:03</div>${html}</div>`;
const taskCard=`<div class="msg"><div class="avatar">AI</div><div><div class="name">AI 上架机器人</div><div class="card"><div class="card-head"><strong>📦 批次 TKS-DEMO-0906 已受理</strong><p>目标市场：PH / TH / VN · 数据来源：1688 配饰</p></div><div class="card-body"><div class="steps"><div class="step done"><b>✓ 采集</b>24 件</div><div class="step done"><b>✓ 清洗</b>96 SKU</div><div class="step running"><b>● 文案</b>三语 RAG</div><div class="step"><b>○ 审图</b>等待</div></div><div class="progress"><i style="width:62%"></i></div><div class="small">任务已持久化，服务重启后可从当前阶段恢复。</div></div></div></div></div>`;
const approval=`<div class="msg"><div class="avatar">AI</div><div><div class="name">AI 上架机器人</div><div class="card"><div class="card-head"><strong>🛡️ 上架前审批</strong><p>所有自动检查已完成，请确认本批次处理方式</p></div><div class="card-body"><div class="metrics"><div class="metric"><b>24</b><span>候选商品</span></div><div class="metric"><b>23</b><span>审图通过</span></div><div class="metric"><b>72</b><span>三站 Listing</span></div><div class="metric"><b>0</b><span>高风险命中</span></div></div><div class="row"><span>规则层：违禁词 / 类目 / 字段上限</span><span class="pill ok">PASS</span></div><div class="row"><span>向量检索：同市场真实文案范例</span><span class="pill ok">Top 3</span></div><div class="row"><span>图片质检：1 张包含中文文字</span><span class="pill wait">已隔离</span></div><div class="row"><span>真实发布授权</span><span class="pill bad">等待人工确认</span></div></div><div class="buttons"><span class="button primary">通过全部</span><span class="button safe">仅通过审图 OK</span><span class="button">驳回并修改</span></div></div></div></div>`;
const publish=`<div class="msg"><div class="avatar">AI</div><div><div class="name">AI 上架机器人</div><div class="card"><div class="card-head"><strong>🚀 已获得一次性上传授权</strong><p>审批人：运营（演示） · 决策：仅发布审图通过项</p></div><div class="card-body"><div class="row"><span>生成发布幂等键</span><span class="pill ok">完成</span></div><div class="row"><span>PH 店铺批量上架</span><span class="pill ok">23 / 23</span></div><div class="row"><span>TH 店铺批量上架</span><span class="pill info">18 / 23</span></div><div class="row"><span>VN 店铺批量上架</span><span class="pill wait">排队中</span></div><div class="progress"><i style="width:73%"></i></div><div class="small">外部平台未明确返回成功的记录不会写入“上架成功”。</div></div></div></div></div>`;
const done=`<div class="msg"><div class="avatar">AI</div><div><div class="name">AI 上架机器人</div><div class="card"><div class="card-head"><strong>✅ 批次发布完成</strong><p>TKS-DEMO-0906 · 已自动回写多维表格与审计记录</p></div><div class="card-body"><div class="callback"><div class="check">✓</div><div><b>69 条 Listing 获得平台成功回执</b><div class="small">PH 23 · TH 23 · VN 23 · 重复发布 0</div></div></div><div class="row"><span>失败与待人工处理</span><span class="pill ok">0</span></div><div class="row"><span>被审图门禁隔离</span><span class="pill wait">1 件商品</span></div><div class="row"><span>审批与发布审计</span><span class="pill ok">已记录</span></div></div><div class="buttons"><span class="button primary">查看多维表格</span><span class="button">查看失败明细</span></div></div></div></div>`;
const screens={
1:wrap(user('采集 24 个 1688 配饰，生成 PH、TH、VN 三站候选商品。')+bot('收到。我会依次执行采集、字段清洗、成本识别、SKU 去重和多市场定价；完成后回传批次卡片。')),
2:wrap(user('继续生成三语 Listing，并检查图片与平台规则。')+taskCard),
3:wrap(user('这批商品可以上架吗？请先给我审批结果，不要直接发布。')+approval),
4:wrap(user('仅通过审图 OK 的商品，批准本批次上架。')+publish+'<div class="cursor"></div>'),
5:wrap(user('查询刚才批次的最终结果。')+done),
6:`<div class="sheet"><div class="sheetbar"><div class="sheetname">📊 TikTok 三站上架结果</div><div class="small">最后同步：今天 10:05</div></div><div class="toolbar"><span>视图：上架结果</span><span>筛选</span><span>分组：批次</span><span>排序：更新时间 ↓</span></div><div class="tablewrap"><div class="table-note">演示视图：商品、店铺和平台 ID 均已脱敏；状态结构与真实工作流一致。</div><table><thead><tr><th>批次</th><th>商品</th><th>市场</th><th>Listing ID</th><th>图片质检</th><th>审批</th><th>发布状态</th><th>回执时间</th></tr></thead><tbody><tr><td>TKS-DEMO-0906</td><td>Minimalist Hair Clip</td><td class="market">PH</td><td class="mask">***4821</td><td><span class="pill ok">通过</span></td><td><span class="pill ok">已批准</span></td><td class="status">✓ 上架成功</td><td>10:04:31</td></tr><tr><td>TKS-DEMO-0906</td><td>Minimalist Hair Clip</td><td class="market">TH</td><td class="mask">***5934</td><td><span class="pill ok">通过</span></td><td><span class="pill ok">已批准</span></td><td class="status">✓ 上架成功</td><td>10:04:48</td></tr><tr><td>TKS-DEMO-0906</td><td>Minimalist Hair Clip</td><td class="market">VN</td><td class="mask">***6057</td><td><span class="pill ok">通过</span></td><td><span class="pill ok">已批准</span></td><td class="status">✓ 上架成功</td><td>10:05:02</td></tr><tr><td>TKS-DEMO-0906</td><td>Pearl Bow Accessory</td><td class="market">PH</td><td class="mask">***7198</td><td><span class="pill ok">通过</span></td><td><span class="pill ok">已批准</span></td><td class="status">✓ 上架成功</td><td>10:04:35</td></tr><tr><td>TKS-DEMO-0906</td><td>Pearl Bow Accessory</td><td class="market">TH</td><td class="mask">***8210</td><td><span class="pill ok">通过</span></td><td><span class="pill ok">已批准</span></td><td class="status">✓ 上架成功</td><td>10:04:52</td></tr><tr><td>TKS-DEMO-0906</td><td>Printed Gift Card</td><td class="market">—</td><td class="mask">—</td><td><span class="pill bad">中文文字</span></td><td><span class="pill wait">已隔离</span></td><td>未触发发布</td><td>10:03:26</td></tr></tbody></table></div></div>`
};
document.getElementById('content').innerHTML=screens[n];if(n===6)document.getElementById('page-title').textContent='TikTok 三站上架结果 · 多维表格';
const c=document.getElementById('counter');for(let i=1;i<=6;i++)c.insertAdjacentHTML('beforeend',`<i class="${i<=n?'on':''}"></i>`);
</script>
</body>
</html>
